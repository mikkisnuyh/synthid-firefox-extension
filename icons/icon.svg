<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shield -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square shield -->
  <path d="M 24 12 L 72 12 Q 80 12 80 20 L 80 45 Q 80 68 48 76 Q 16 68 16 45 L 16 20 Q 16 12 24 12 Z"
        fill="url(#shieldGradient)" stroke="none"/>

  <!-- Magnifying glass inside shield -->
  <g transform="translate(48, 48)">
    <!-- Circle (lens) -->
    <circle cx="-4" cy="-4" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
    <!-- Handle -->
    <line x1="8" y1="8" x2="20" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sparkle accent -->
  <g transform="translate(66, 24)">
    <!-- Sparkle star -->
    <circle cx="0" cy="0" r="2" fill="#ffd700"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#ffd700" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#ffd700" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
